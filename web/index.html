<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EE9A4C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HindiMitra" />
  <meta name="description" content="Learn Hindi the fun way — write, read, and play. हिन्दी सीखो।" />
  <title>HindiMitra — Learn Hindi</title>

  <style id="app-reset">
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      overflow: hidden;
      background-color: #FCF9EE;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    :focus-visible { outline: 2px solid #EE9A4C; outline-offset: 2px; border-radius: 4px; }

    /* Branded splash shown while the Flutter engine downloads and starts. */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(circle at 50% 38%, #FFF4E2 0%, #FCF9EE 60%);
      color: #453B2E; transition: opacity 320ms ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img {
      width: 96px; height: 96px; border-radius: 28px;
      box-shadow: 0 6px 0 #C97A2A, 0 18px 36px -12px rgba(238, 154, 76, 0.55);
      animation: bob 1.2s ease-in-out infinite alternate;
    }
    #splash h1 { margin: 10px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.3px; }
    #splash p { margin: 0; font-size: 15px; color: #8B7B62; }
    #splash .bar {
      width: 180px; height: 8px; margin-top: 10px; border-radius: 999px; overflow: hidden; background: #F1EAD8;
    }
    #splash .bar span {
      display: block; width: 40%; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #F5B679, #EE9A4C);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash .bar span { animation: none; }
    }
  </style>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <noscript>You need to enable JavaScript to run HindiMitra.</noscript>
  <div id="splash" role="status" aria-label="Loading HindiMitra">
    <img src="icons/Icon-192.png" alt="" />
    <h1>HindiMitra</h1>
    <p>हिन्दी सीखो · Learn Hindi the fun way</p>
    <div class="bar"><span></span></div>
  </div>
  <script>
    // Fade the splash out once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hidden');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
